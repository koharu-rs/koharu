name: Build

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux builds on the oldest Ubuntu Koharu supports, since a binary
        # needs the glibc it was linked against or a newer one.
        os: [macos-latest, windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install --no-install-recommends \
            libgtk-4-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-app-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install macOS CEF helper targets
        if: startsWith(matrix.os, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # bindgen parses MSVC's standard library, which rejects a Clang older
      # than its Visual Studio's; the runner's own LLVM can lag behind it. As in
      # rust-bindgen's CI, a fork until KyleMayes/install-llvm-action#103 merges.
      - name: Install LLVM
        if: startsWith(matrix.os, 'windows')
        uses: momo5502/install-llvm-action@7372aab026498959cff47c82953ba378477d4b00
        with:
          version: '22.1.8'
      - run: bun install
      - run: bun run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: koharu-${{ matrix.os }}
          path: |
            target/release/koharu*
          retention-days: 3
