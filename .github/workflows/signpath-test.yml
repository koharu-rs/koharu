name: SignPath test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/signpath*'
      - '.github/workflows/signpath-test.yml'

permissions:
  actions: read
  contents: read

jobs:
  sign:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test ./.github/signpath.test.ts
      - name: Build and sign a test executable
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_SIGNING_POLICY_SLUG: test-signing
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        with:
          # A JavaScript action supplies the artifact runtime credentials inherited by Bun.
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs/promises');
            const file = require('node:path').join(process.env.RUNNER_TEMP, 'signpath-probe.exe');
            await exec.exec('rustc', ['--crate-name', 'signpath_probe', '.github/signpath-fixture.rs', '-o', file]);
            const unsigned = await fs.readFile(file);
            await exec.exec('bun', ['.github/signpath.ts', file]);
            assert(!unsigned.equals(await fs.readFile(file)), 'Signing did not change the executable');
            const result = await exec.getExecOutput(file);
            assert.equal(result.stdout.trim(), 'Koharu SignPath integration test');
      - uses: actions/upload-artifact@v7
        with:
          name: signpath-signed-probe
          path: ${{ runner.temp }}/signpath-probe.exe
          retention-days: 3
