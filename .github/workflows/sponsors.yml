name: Sponsors

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sponsors
  cancel-in-progress: true

jobs:
  update:
    name: Update sponsor graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
      SPONSORKIT_PATREON_TOKEN: ${{ secrets.SPONSORKIT_PATREON_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run sponsors

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: .github/sponsorkit/sponsors.svg
          branch: automation/sponsors
          commit-message: 'chore: update sponsors [skip ci]'
          title: 'chore: update sponsors'
          body: Automated SponsorKit graph update.
