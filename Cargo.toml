[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.83.5"
edition = "2024"
description = "Manga translation tools"
license = "MIT OR Apache-2.0"
authors = [
    "Mayo Takanashi <mayo@linux.com>",
    "Wangchong Zhou <fffonion@gmail.com>",
]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false

[workspace.dependencies]
koharu-bindgen = { path = "crates/koharu-bindgen" }
koharu-config = { path = "crates/koharu-config" }
koharu-diffusion = { path = "crates/koharu-diffusion" }
koharu-diffusion-sys = { path = "crates/koharu-diffusion-sys" }
koharu-leptonica = { path = "crates/koharu-leptonica" }
koharu-llama = { path = "crates/koharu-llama", features = ["llguidance", "mtmd"] }
koharu-llama-sys = { path = "crates/koharu-llama-sys" }
koharu-llm = { path = "crates/koharu-llm" }
koharu-ml = { path = "crates/koharu-ml" }
koharu-agent = { path = "crates/koharu-agent" }
koharu-canvas = { path = "crates/koharu-canvas" }
koharu-desktop = { path = "crates/koharu-desktop" }
koharu-pipeline = { path = "crates/koharu-pipeline" }
koharu-psd = { path = "crates/koharu-psd" }
koharu-renderer = { path = "crates/koharu-renderer" }
koharu-runtime = { path = "crates/koharu-runtime" }
koharu-scene = { path = "crates/koharu-scene" }
koharu-sentry = { path = "crates/koharu-sentry" }
koharu-torch = { path = "crates/koharu-torch" }
koharu-torch-sys = { path = "crates/koharu-torch-sys" }

# external dependencies
ab_glyph = "0.2.32"
age = "0.12.1"
alphanumeric-sort = "1.5.8"
anyhow = "1.0.104"
atomicwrites = "0.4.4"
axum = "0.8.9"
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
base64 = "0.23.1"
bindgen = { version = "0.73.2", default-features = false, features = ["logging", "runtime"] }
blake3 = "1.8.7"
bytes = "1.12.1"
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive"] }
color = "0.3.3"
criterion = { version = "0.8.2", features = ["html_reports"] }
cursor-icon = "1.2.0"
derive_more = { version = "2.1.1", features = ["display", "from", "from_str"] }
dirs = "7.0.0"
encoding_rs = "0.8.44"
enumflags2 = "0.7.12"
fast-glob = "1.1.2"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
flate2 = { version = "1.1.11", features = ["zlib-rs"] }
fontique = "0.12.0"
fs-err = "3.3.2"
futures = "0.3.34"
half = "2.7.1"
harfrust = "0.15.0"
hayro = "0.8.0"
hf-hub = "1.0.0"
http = "1.5.0"
hypher = "0.1.8"
icu_experimental = { version = "0.7.0", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.4.0", features = ["alloc", "serde"] }
icu_properties = { version = "2.4.0", features = ["compiled_data"] }
icu_segmenter = { version = "2.4.0", features = ["compiled_data"] }
image = "0.25.10"
imageproc = "0.27.0"
imbl = { version = "7.0.2", features = ["serde"] }
indoc = "2.0.8"
jieba-rs = "0.11.0"
json-patch = { version = "5.0.0", default-features = false }
jsonptr = "0.8.2"
keyring = "4.2.0"
kurbo = "0.13.1"
libloading = "0.9.0"
llguidance = "1.9.1"
machine-uid = "0.6.0"
memmap2 = "0.9.12"
minijinja = { version = "3.1.0", features = ["json", "loop_controls", "preserve_order", "serde"] }
minijinja-contrib = { version = "3.1.0", features = ["pycompat"] }
parking_lot = "0.13.0"
petgraph = "0.8.3"
photocraft-psd = { git = "https://github.com/storytold/photocraft", rev = "d6b97e5b4b1d9a03c3ef9b904dd5de864f5e8aa8" }
pollster = "1.0.1"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quick_cache = "0.7.0"
quote = "1.0.47"
rars = "0.12.2"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["stream", "json", "form", "blocking", "multipart"] }
rfd = "0.18.0"
# rig breaks its API in every release.
rig-agent = { version = "=0.46.0", default-features = false }
rig-core = { version = "=0.46.0", default-features = false }
rig-memory = { version = "=0.46.0", default-features = false }
rig-reqwest = { version = "=0.46.0", default-features = false }
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
safetensors = "0.8.0"
schemars = { version = "1.2.3", features = ["chrono04", "indexmap2", "uuid1"] }
secrecy = "0.10.3"
semver = "1.0.28"
sentry = { version = "0.49.5", features = ["minidump", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
# Floats must survive a write and a reopen unchanged, so memory and file agree.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_json_canonicalizer = "0.4.1"
serde_rusqlite = "0.44.0"
serde_with = { version = "3.24.0", default-features = false, features = ["json", "macros"] }
similar = "3.2.1"
skrifa = "0.49.0"
smallvec = "1.16.5"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json", "url", "uuid"] }
specta-serde = "=0.0.15"
specta-typescript = "=0.0.15"
static_assertions = "1.1.0"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.10", features = ["full"] }
tar = "0.4.46"
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "17a527316d3aee46f7185c178d3b3122d8ebfd7b", default-features = false, features = [
    "compression",
    "dynamic-acl",
    "specta",
] }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "17a527316d3aee46f7185c178d3b3122d8ebfd7b" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "17a527316d3aee46f7185c178d3b3122d8ebfd7b", features = ["build"] }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "14ed4c4f9e717929347b9c5609acaefc259a4e22" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "14ed4c4f9e717929347b9c5609acaefc259a4e22" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "14ed4c4f9e717929347b9c5609acaefc259a4e22" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "14ed4c4f9e717929347b9c5609acaefc259a4e22" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "14ed4c4f9e717929347b9c5609acaefc259a4e22" }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "14ed4c4f9e717929347b9c5609acaefc259a4e22" }
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "17a527316d3aee46f7185c178d3b3122d8ebfd7b", features = ["unstable"] }
# The native window and event types of `Cef::on_window_event`: the runtime's
# own winit fork, which it does not re-export.
tauri-winit = { version = "=0.31.0-beta.3", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
# disables `esaxx_fast` feature which is conflicting with `ort`
tokenizers = { version = "0.23.2", features = ["onig"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
toktrie = "1.9.1"
toml = "1.2.1"
toml_edit = "0.25.19"
# Every span and event is also a `log` record, which tauri-plugin-log writes
# to the app's log file.
tracing = { version = "0.1.44", features = ["log-always"] }
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
ui-events = { version = "0.3.0", features = ["kurbo"] }
ui-events-winit = "0.3.0"
unicode-bidi = "0.3.18"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
vello = "0.11.0"
vello_cpu = { version = "0.4.0", default-features = false, features = ["std", "u8_pipeline"] }
webp = { version = "0.3.1" }
winit = "0.30.13"
windows = { version = "0.62.2", features = [
    "Win32",
    "Win32_System",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "9.5.0", features = ["deflate"] }

[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "17a527316d3aee46f7185c178d3b3122d8ebfd7b" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "17a527316d3aee46f7185c178d3b3122d8ebfd7b" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "17a527316d3aee46f7185c178d3b3122d8ebfd7b" }

[profile.dev]
# Image decoding and the models' pre- and post-processing ran 10 to 40 times
# slower unoptimized, so debug builds optimize lightly, and dependencies fully.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Keep debug information for Sentry's native stack traces and source context.
debug = true
