[workspace]
members = ["crates/*"]
default-members = ["crates/koharu"]
resolver = "3"

[workspace.package]
version = "0.82.1"
edition = "2024"
description = "Manga translation tools"
license = "MIT OR Apache-2.0"
authors = [
    "Mayo Takanashi <mayo@linux.com>",
    "Wangchong Zhou <fffonion@gmail.com>",
]
readme = "README.md"
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = false

[workspace.dependencies]
koharu-app = { path = "crates/koharu-app" }
koharu-bindgen = { path = "crates/koharu-bindgen" }
koharu-config = { path = "crates/koharu-config" }
koharu-storage = { path = "crates/koharu-storage" }
koharu-scene = { path = "crates/koharu-scene" }
koharu-diffusion = { path = "crates/koharu-diffusion" }
koharu-diffusion-sys = { path = "crates/koharu-diffusion-sys" }
koharu-llama = { path = "crates/koharu-llama" }
koharu-llama-sys = { path = "crates/koharu-llama-sys" }
koharu-runtime = { path = "crates/koharu-runtime" }
koharu-torch = { path = "crates/koharu-torch" }
koharu-torch-sys = { path = "crates/koharu-torch-sys" }
koharu-agent = { path = "crates/koharu-agent" }
koharu-ml = { path = "crates/koharu-ml" }
koharu-metrics = { path = "crates/koharu-metrics" }
koharu-pipeline = { path = "crates/koharu-pipeline" }
koharu-translator = { path = "crates/koharu-translator" }
koharu-psd = { path = "crates/koharu-psd" }
koharu-renderer = { path = "crates/koharu-renderer" }
koharu-rasterizer = { path = "crates/koharu-rasterizer", default-features = false }
koharu-desktop = { path = "crates/koharu-desktop" }
koharu-secrets = { path = "crates/koharu-secrets" }

# external dependencies
alphanumeric-sort = "1.5.8"
arc-swap = "1.9.2"
hayro = "0.7.1"
image = "0.25.10"
webp = { version = "0.3.1" }
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
imageproc = "0.27.0"
ab_glyph = "0.2.32"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive", "url", "uuid"] }
specta-typescript = "=0.0.12"
tokio = { version = "1.53.1", features = ["full"] }
log = "0.4.34"
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
console = "0.16.4"
open = "5.4.3"
rfd = "0.17.2"
thiserror = "2.0.20"
blake3 = "1.8.7"
dunce = "1.0.5"
rayon = "1.12.0"
# disables `esaxx_fast` feature which is conflicting with `ort`
tokenizers = { version = "0.23.2", features = ["onig"] }
strum = { version = "0.28.0", features = ["derive"] }
sys-locale = "0.3.2"
sysinfo = { version = "0.39.6", features = ["system"] }
rars = "0.9.4"
zip = { version = "8.6.0", features = ["deflate"] }
dirs = "7.0.0"
futures = "0.3.34"
futures-channel = "0.3.34"
hf-hub = "=1.0.0"
eventsource-stream = "0.2.3"
encoding_rs = "0.8.41"
enumflags2 = "0.7.12"
reqwest = { version = "0.13.5", features = ["stream", "json", "form", "blocking", "multipart"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
secrecy = { version = "0.10.3", features = ["serde"] }
toml = "1.1.5"
url = { version = "2.5.8", features = ["serde"] }
petgraph = "0.8.3"
imbl = "7.0.2"
hashbrown = "0.17.1"
slotmap = "1.1.1"
smallvec = "1.16.0"
revision = { version = "0.30.0", features = ["uuid"] }
flate2 = "1.1.10"
tempfile = "3.27.0"
libloading = "0.9.0"
nvml-wrapper = "0.13.0"
minijinja = "2.24.0"
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
indoc = "2.0.7"
windows = { version = "0.62.2", features = [
    "Win32",
    "Win32_System",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
skrifa = "0.47.0"
harfrust = "0.13.3"
hypher = "0.1.7"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = "2.3.0"
icu_segmenter = "2.3.0"
jieba-rs = "0.10.3"
fontique = "0.11.1"
pollster = "1.0.1"
vello = "0.10.0"
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286", default-features = false, features = [
    "compression",
    "dynamic-acl",
    "macos-private-api",
    "specta",
] }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286" }
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286", features = ["macos-private-api"] }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
schemars = { version = "1.2.2", features = ["chrono04", "indexmap2", "uuid1"] }
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }
atomicwrites = "0.4.4"
fs4 = "1.1.0"
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["use-std"] }
walkdir = "2.5.0"
base64 = "0.23.1"
unicode-bidi = "0.3.18"
criterion = { version = "0.8.2", features = ["html_reports"] }
keyring = { version = "4.2.0", features = ["linux-keyutils-keyring-store"] }
keyring-core = "1.0.0"
linux-keyutils-keyring-store = "1.0.0"
llguidance = "1.8.0"
sentry = { version = "0.49.2", features = ["tracing"] }
fast-glob = "1.1.1"
tar = "0.4.46"
toktrie = "1.8.0"
bytes = "1.12.1"
half = "2.7.1"
js-sys = "0.3.105"
lazy_static = "1.5.0"
ndarray = "0.17.2"
rand = "0.10.2"
safetensors = "0.8.0"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = "0.3.105"
bindgen = "0.73.2"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full"] }
libc = "0.2.189"
memmap2 = "0.9.11"

[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "fe0e5155c12459f3250dd9ae5867dd627d7c8286" }

[profile.dev]
debug = 1

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.koharu-canvas]
opt-level = 3

[profile.dev.package.koharu-rasterizer]
opt-level = 3

[profile.dev.package.postcard]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.webp]
opt-level = 3

[profile.dev.package.libwebp-sys]
opt-level = 3
