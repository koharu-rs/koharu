[package]
name = "koharu-pipeline"
version.workspace = true
edition.workspace = true
description = "In-process scene-processing workflow for Koharu."
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
koharu-ml = { workspace = true }
koharu-config = { workspace = true }
koharu-renderer = { workspace = true }
koharu-rasterizer = { workspace = true, features = ["native"] }
koharu-scene = { workspace = true }
koharu-translator = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
strum = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-rayon = { workspace = true }
tracing = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
toml = { workspace = true }
