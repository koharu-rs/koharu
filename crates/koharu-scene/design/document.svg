<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    text { fill: #1f2933; }
    .s { font-size: 11.5px; fill: #52606d; }
    .b { font-weight: 600; }
    .t { font-size: 14px; font-weight: 600; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .line { stroke: #e4e7eb; }
    .art { fill: none; stroke: #9aa5b1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4a6fa5"/></marker>
    <g id="eye"><path d="M-8,0 Q0,-7 8,0 Q0,7 -8,0z" fill="none" stroke="#52606d" stroke-width="1.3"/><circle r="2.4" fill="#52606d"/></g>
    <g id="folder"><path d="M0,2 H6 L8,4 H16 V14 H0z" fill="#fdf0c4" stroke="#b7950b"/></g>
    <g id="textIcon"><rect width="16" height="16" rx="3" fill="#eef3fb" stroke="#4a6fa5"/><text x="8" y="13" class="c b" font-size="12" style="fill:#4a6fa5">T</text></g>
    <g id="shapeIcon"><path d="M8,1 L15,8 L8,15 L1,8z" fill="#eef3fb" stroke="#4a6fa5"/></g>
    <g id="rasterIcon"><rect width="16" height="16" fill="#eef3fb" stroke="#4a6fa5"/><path d="M5.3,0 V16 M10.6,0 V16 M0,5.3 H16 M0,10.6 H16" stroke="#9fb3d1"/></g>
    <g id="maskIcon"><rect width="16" height="16" fill="#3e4c59"/><circle cx="8" cy="8" r="4.5" fill="#ffffff"/></g>
    <g id="imageIcon"><rect width="16" height="16" fill="#ffffff" stroke="#4a6fa5"/><path d="M2,13 L6,7 L9,11 L11,9 L14,13z" fill="#9fb3d1"/><circle cx="11.5" cy="4.5" r="1.6" fill="#9fb3d1"/></g>
    <g id="page"><rect width="52" height="72" fill="#ffffff"/><rect x="5" y="5" width="42" height="28" class="art"/><rect x="5" y="37" width="20" height="30" class="art"/><rect x="27" y="37" width="20" height="30" class="art"/></g>
  </defs>
  <rect width="760" height="356" fill="#ffffff"/>

  <rect x="20" y="20" width="220" height="316" rx="14" fill="#f8fafc" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="40" y="48" class="t">Project</text>
  <text x="40" y="66" class="s">version and ordered pages</text>

  <use href="#page" x="40" y="86"/>
  <rect x="40" y="86" width="52" height="72" fill="none" stroke="#4a6fa5" stroke-width="2"/>
  <text x="106" y="114" class="b">Page 1</text>
  <text x="106" y="132" class="s">1200 × 1800</text>
  <use href="#page" x="40" y="172"/>
  <rect x="40" y="172" width="52" height="72" fill="none" stroke="#9aa5b1"/>
  <text x="106" y="200" class="b">Page 2</text>
  <text x="106" y="218" class="s">1200 × 1800</text>
  <use href="#page" x="40" y="258"/>
  <rect x="40" y="258" width="52" height="72" fill="none" stroke="#9aa5b1"/>
  <text x="106" y="286" class="b">Page 3</text>
  <text x="106" y="304" class="s">1400 × 1800</text>

  <path d="M188,122 H286" fill="none" stroke="#4a6fa5" stroke-width="2" marker-end="url(#blue)"/>

  <rect x="290" y="20" width="450" height="316" rx="10" fill="#ffffff" stroke="#cbd2d9"/>
  <path d="M290,56 V30 A10,10 0 0 1 300,20 H730 A10,10 0 0 1 740,30 V56z" fill="#eef1f5"/>
  <text x="306" y="43" class="b">Layers of page 1</text>
  <text x="726" y="43" class="s e">top of the list draws on top</text>

  <line x1="290" y1="56" x2="740" y2="56" class="line"/>
  <line x1="290" y1="94" x2="740" y2="94" class="line"/>
  <line x1="290" y1="132" x2="740" y2="132" class="line"/>
  <line x1="290" y1="170" x2="740" y2="170" class="line"/>
  <line x1="290" y1="208" x2="740" y2="208" class="line"/>
  <line x1="290" y1="246" x2="740" y2="246" class="line"/>
  <line x1="290" y1="284" x2="740" y2="284" class="line"/>

  <use href="#eye" x="313" y="75"/>
  <use href="#folder" x="336" y="67"/>
  <text x="362" y="80" class="b">group</text>
  <text x="520" y="80" class="s">a folder of layers</text>

  <use href="#eye" x="313" y="113"/>
  <use href="#textIcon" x="358" y="105"/>
  <text x="384" y="118" class="b">text</text>
  <text x="520" y="118" class="s">point, box, or inside a closed path</text>

  <use href="#eye" x="313" y="151"/>
  <use href="#shapeIcon" x="358" y="143"/>
  <text x="384" y="156" class="b">shape</text>
  <text x="520" y="156" class="s">a vector path, fill, and stroke</text>

  <use href="#eye" x="313" y="189"/>
  <use href="#rasterIcon" x="336" y="181"/>
  <text x="362" y="194" class="b">raster</text>
  <text x="520" y="194" class="s">editable pixels</text>

  <use href="#eye" x="313" y="227"/>
  <use href="#maskIcon" x="358" y="219"/>
  <text x="384" y="232" class="b">mask · add</text>
  <text x="520" y="232" class="s">pixels or a closed path</text>

  <use href="#eye" x="313" y="265"/>
  <use href="#maskIcon" x="358" y="257"/>
  <text x="384" y="270" class="b">mask · subtract</text>
  <text x="520" y="270" class="s">masks apply in order</text>

  <use href="#eye" x="313" y="303"/>
  <use href="#imageIcon" x="336" y="295"/>
  <text x="362" y="308" class="b">image</text>
  <text x="520" y="308" class="s">the imported file, byte for byte</text>
</svg>
