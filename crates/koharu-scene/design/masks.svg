<svg xmlns="http://www.w3.org/2000/svg" width="730" height="240" viewBox="0 0 730 240" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    text { fill: #1f2933; }
    .s { font-size: 11.5px; fill: #52606d; }
    .b { font-weight: 600; }
    .c { text-anchor: middle; }
    .op { font-size: 30px; fill: #52606d; text-anchor: middle; }
    .hidden { fill: #3e4c59; }
  </style>
  <defs>
    <g id="bars">
      <rect x="30" y="22" width="13" height="76" rx="6.5" fill="#ffffff"/>
      <rect x="53" y="22" width="13" height="58" rx="6.5" fill="#ffffff"/>
      <rect x="76" y="22" width="13" height="68" rx="6.5" fill="#ffffff"/>
    </g>
    <path id="brush" d="M20,104 C34,78 58,112 98,92" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
    <path id="eraser" d="M18,60 L102,54" fill="none" stroke-width="11" stroke-linecap="round"/>
  </defs>
  <rect width="730" height="240" fill="#ffffff"/>
  <text x="365" y="22" class="s c">Masks of the inpainting raster, applied left to right; white shows the raster</text>

  <g transform="translate(30,40)">
    <rect width="120" height="120" class="hidden"/>
    <use href="#bars"/>
    <rect width="120" height="120" fill="none" stroke="#d9822b" stroke-width="3"/>
  </g>
  <text x="90" y="186" class="b c">Detector</text>
  <text x="90" y="204" class="s c">add · generated</text>

  <text x="177" y="110" class="op">+</text>

  <g transform="translate(205,40)">
    <rect width="120" height="120" class="hidden"/>
    <use href="#brush"/>
    <rect width="120" height="120" fill="none" stroke="#2f9e5b" stroke-width="3"/>
  </g>
  <text x="265" y="186" class="b c">Your brush</text>
  <text x="265" y="204" class="s c">add</text>

  <text x="352" y="110" class="op">−</text>

  <g transform="translate(380,40)">
    <rect width="120" height="120" class="hidden"/>
    <use href="#eraser" stroke="#ffffff"/>
    <rect width="120" height="120" fill="none" stroke="#2f9e5b" stroke-width="3"/>
  </g>
  <text x="440" y="186" class="b c">Your eraser</text>
  <text x="440" y="204" class="s c">subtract</text>

  <text x="540" y="110" class="op">=</text>

  <g transform="translate(580,40)">
    <rect width="120" height="120" class="hidden"/>
    <use href="#bars"/>
    <use href="#brush"/>
    <use href="#eraser" stroke="#3e4c59"/>
    <rect width="120" height="120" fill="none" stroke="#4a6fa5" stroke-width="3"/>
  </g>
  <text x="640" y="186" class="b c">The mask</text>
  <text x="640" y="204" class="s c">one PSD layer mask on export</text>
</svg>
