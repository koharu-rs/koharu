<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    text { fill: #1f2933; }
    .s { font-size: 11.5px; fill: #52606d; }
    .b { font-weight: 600; }
    .t { font-size: 14px; font-weight: 600; }
    .c { text-anchor: middle; }
  </style>
  <defs>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d9822b"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f9e5b"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>

  <text x="95" y="34" class="t c">Workflow</text>
  <text x="95" y="52" class="s c">changes over time</text>
  <rect x="20" y="66" width="150" height="30" rx="15" fill="#fff4e5" stroke="#d9822b"/>
  <text x="95" y="86" class="c">detect</text>
  <rect x="20" y="104" width="150" height="30" rx="15" fill="#fff4e5" stroke="#d9822b"/>
  <text x="95" y="124" class="c">OCR</text>
  <rect x="20" y="142" width="150" height="30" rx="15" fill="#fff4e5" stroke="#d9822b"/>
  <text x="95" y="162" class="c">translate</text>
  <rect x="20" y="180" width="150" height="30" rx="15" fill="#fff4e5" stroke="#d9822b"/>
  <text x="95" y="200" class="c">inpaint</text>
  <rect x="20" y="218" width="150" height="30" rx="15" fill="#fff4e5" stroke="#d9822b"/>
  <text x="95" y="238" class="c">typeset</text>
  <rect x="20" y="268" width="150" height="30" rx="15" fill="#e9f7ef" stroke="#2f9e5b"/>
  <text x="95" y="288" class="c">You, editing</text>

  <path d="M174,81 H182 V233 H174" fill="none" stroke="#d9822b" stroke-width="1.5"/>
  <path d="M182,157 H264" fill="none" stroke="#d9822b" stroke-width="2" marker-end="url(#amber)"/>
  <text x="224" y="149" class="s c">writes</text>
  <path d="M174,283 H264" fill="none" stroke="#2f9e5b" stroke-width="2" marker-end="url(#green)"/>
  <text x="224" y="275" class="s c">edits</text>

  <rect x="270" y="20" width="290" height="296" rx="14" fill="#f8fafc" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="415" y="46" class="t c">Project document</text>
  <text x="415" y="64" class="s c">schema stays the same</text>

  <rect x="288" y="80" width="254" height="68" rx="10" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="304" y="102" class="b">Layers</text>
  <text x="304" y="120" class="s">pages of groups, images, rasters,</text>
  <text x="304" y="135" class="s">shapes, text, and masks</text>

  <rect x="288" y="160" width="254" height="68" rx="10" fill="#ffffff" stroke="#4a6fa5"/>
  <text x="304" y="182" class="b">Generated values and overrides</text>
  <rect x="304" y="194" width="112" height="22" rx="11" fill="#fff4e5" stroke="#d9822b"/>
  <text x="360" y="209" class="s c">what a model wrote</text>
  <rect x="422" y="194" width="106" height="22" rx="11" fill="#e9f7ef" stroke="#2f9e5b"/>
  <text x="475" y="209" class="s c">what you changed</text>

  <rect x="288" y="240" width="254" height="68" rx="10" fill="#f5f7fa" stroke="#9aa5b1"/>
  <text x="304" y="262" class="b">Attributes</text>
  <text x="304" y="280" class="s">namespaced data for tools,</text>
  <text x="304" y="295" class="s">never drawn</text>

  <path d="M560,124 H616" fill="none" stroke="#4a6fa5" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M560,204 H616" fill="none" stroke="#4a6fa5" stroke-width="2" marker-end="url(#blue)"/>
  <rect x="620" y="96" width="120" height="56" rx="10" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="680" y="119" class="b c">Canvas</text>
  <text x="680" y="137" class="s c">draws the layers</text>
  <rect x="620" y="176" width="120" height="56" rx="10" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="680" y="199" class="b c">PSD export</text>
  <text x="680" y="217" class="s c">writes the layers</text>
</svg>
