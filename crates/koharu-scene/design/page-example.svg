<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13">
  <style>
    text { fill: #1f2933; }
    .s { font-size: 11.5px; fill: #52606d; }
    .b { font-weight: 600; }
    .c { text-anchor: middle; }
    .ink { fill: none; stroke: #1f2933; stroke-width: 1; }
    .art { fill: none; stroke: #9aa5b1; stroke-width: 1; }
    .lead { stroke: #9aa5b1; stroke-width: 1; }
    .chipGen { fill: #fff4e5; stroke: #d9822b; }
    .chipYou { fill: #e9f7ef; stroke: #2f9e5b; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#52606d"/></marker>
  </defs>
  <rect width="760" height="456" fill="#ffffff"/>

  <path d="M28,440 V44" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="18" y="242" class="s c" transform="rotate(-90 18 242)">later layers draw on top</text>

  <!-- Each sheet is a 240 x 320 page, sheared into a stack. -->

  <!-- image: imported page -->
  <g transform="matrix(1 0 -0.55 0.32 230 336)">
    <rect width="240" height="320" fill="#ffffff" stroke="#52606d" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <rect x="12" y="12" width="216" height="140" class="ink" vector-effect="non-scaling-stroke"/>
    <rect x="12" y="162" width="104" height="146" class="ink" vector-effect="non-scaling-stroke"/>
    <rect x="124" y="162" width="104" height="146" class="ink" vector-effect="non-scaling-stroke"/>
    <path d="M24,140 Q60,96 100,140 M150,300 Q176,250 214,300" class="art" vector-effect="non-scaling-stroke"/>
    <circle cx="176" cy="240" r="22" class="art" vector-effect="non-scaling-stroke"/>
    <ellipse cx="160" cy="70" rx="46" ry="42" fill="#ffffff" class="ink" vector-effect="non-scaling-stroke"/>
    <rect x="146" y="46" width="5" height="46" fill="#1f2933"/>
    <rect x="158" y="46" width="5" height="38" fill="#1f2933"/>
    <rect x="170" y="46" width="5" height="42" fill="#1f2933"/>
    <ellipse cx="64" cy="206" rx="34" ry="30" fill="#ffffff" class="ink" vector-effect="non-scaling-stroke"/>
    <rect x="56" y="190" width="5" height="32" fill="#1f2933"/>
    <rect x="68" y="190" width="5" height="26" fill="#1f2933"/>
  </g>

  <!-- raster: inpainting -->
  <g transform="matrix(1 0 -0.55 0.32 230 236)">
    <rect width="240" height="320" fill="#ffffff" fill-opacity="0.6" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
    <rect x="140" y="40" width="42" height="58" rx="8" fill="#fff4e5" stroke="#d9822b" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
    <rect x="50" y="184" width="30" height="44" rx="8" fill="#fff4e5" stroke="#d9822b" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- raster: retouching -->
  <g transform="matrix(1 0 -0.55 0.32 230 136)">
    <rect width="240" height="320" fill="#ffffff" fill-opacity="0.6" stroke="#2f9e5b" stroke-width="1.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
    <path d="M140,250 C160,222 186,272 212,236" fill="none" stroke="#2f9e5b" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- group: text block -->
  <g transform="matrix(1 0 -0.55 0.32 230 36)">
    <rect width="240" height="320" fill="#ffffff" fill-opacity="0.6" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
    <ellipse cx="160" cy="70" rx="46" ry="42" fill="none" stroke="#9aa5b1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>
    <rect x="146" y="46" width="5" height="46" fill="none" stroke="#9aa5b1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
    <rect x="158" y="46" width="5" height="38" fill="none" stroke="#9aa5b1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
    <rect x="170" y="46" width="5" height="42" fill="none" stroke="#9aa5b1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
    <ellipse cx="64" cy="206" rx="34" ry="30" fill="none" stroke="#9aa5b1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>
  </g>
  <!-- The translations sit on the top sheet, drawn unsheared so they stay legible. -->
  <text x="349" y="64" class="b c" font-size="12">HELLO!</text>
  <text x="177" y="108" class="b c" font-size="10.5">HI!</text>

  <!-- Labels -->
  <line x1="386" y1="87" x2="494" y2="87" class="lead"/>
  <rect x="500" y="50" width="76" height="18" rx="9" class="chipGen"/>
  <text x="538" y="63" class="s c">generated</text>
  <text x="500" y="88" class="b">group · text block</text>
  <text x="500" y="104" class="s">hidden shape: the balloon outline</text>
  <text x="500" y="118" class="s">hidden text: ja, from OCR</text>
  <text x="500" y="132" class="s">text: en, the translation</text>

  <line x1="386" y1="187" x2="494" y2="187" class="lead"/>
  <rect x="500" y="150" width="88" height="18" rx="9" class="chipYou"/>
  <text x="544" y="163" class="s c">added by you</text>
  <text x="500" y="188" class="b">raster · retouching</text>
  <text x="500" y="204" class="s">your brush work</text>

  <line x1="386" y1="287" x2="494" y2="287" class="lead"/>
  <rect x="500" y="250" width="76" height="18" rx="9" class="chipGen"/>
  <text x="538" y="263" class="s c">generated</text>
  <text x="500" y="288" class="b">raster · inpainting</text>
  <text x="500" y="304" class="s">drawn inside its masks: the</text>
  <text x="500" y="318" class="s">detector's, plus your strokes</text>

  <line x1="386" y1="387" x2="494" y2="387" class="lead"/>
  <rect x="500" y="350" width="88" height="18" rx="9" class="chipYou"/>
  <text x="544" y="363" class="s c">added by you</text>
  <text x="500" y="388" class="b">image · imported page</text>
  <text x="500" y="404" class="s">the original file, byte for byte</text>
</svg>
