<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#222">One loaded model: a thread, a context, and its sequences</text>
  <text x="20" y="52" fill="#555">order, not to scale</text>

  <!-- Decode steps shared by every running sequence. -->
  <g stroke="#e3e3e3">
    <line x1="220" y1="70" x2="220" y2="262"/>
    <line x1="250" y1="70" x2="250" y2="262"/>
    <line x1="280" y1="70" x2="280" y2="262"/>
    <line x1="310" y1="70" x2="310" y2="262"/>
    <line x1="340" y1="70" x2="340" y2="262"/>
    <line x1="370" y1="70" x2="370" y2="262"/>
    <line x1="400" y1="70" x2="400" y2="262"/>
    <line x1="430" y1="70" x2="430" y2="262"/>
    <line x1="460" y1="70" x2="460" y2="262"/>
    <line x1="490" y1="70" x2="490" y2="262"/>
    <line x1="520" y1="70" x2="520" y2="262"/>
    <line x1="550" y1="70" x2="550" y2="262"/>
    <line x1="580" y1="70" x2="580" y2="262"/>
    <line x1="610" y1="70" x2="610" y2="262"/>
    <line x1="640" y1="70" x2="640" y2="262"/>
    <line x1="670" y1="70" x2="670" y2="262"/>
    <line x1="700" y1="70" x2="700" y2="262"/>
    <line x1="730" y1="70" x2="730" y2="262"/>
    <line x1="760" y1="70" x2="760" y2="262"/>
    <line x1="790" y1="70" x2="790" y2="262"/>
    <line x1="820" y1="70" x2="820" y2="262"/>
  </g>

  <g fill="#333">
    <text x="20" y="96">page 1</text>
    <text x="20" y="144">page 2</text>
    <text x="20" y="192">page 3</text>
    <text x="20" y="240">page 4</text>
  </g>

  <!-- Shared instructions, decoded once, copied. -->
  <rect x="90" y="78" width="60" height="28" rx="3" fill="#bab0ac"/>
  <text x="96" y="96" fill="#fff">instr.</text>
  <g fill="#bab0ac" fill-opacity="0.45" stroke="#bab0ac" stroke-dasharray="3 2">
    <rect x="90" y="126" width="60" height="28" rx="3"/>
    <rect x="90" y="174" width="60" height="28" rx="3"/>
  </g>
  <text x="156" y="144" fill="#777" font-size="11">copied</text>

  <!-- Images, one at a time. -->
  <g fill="#f58518">
    <rect x="154" y="78" width="56" height="28" rx="3"/>
    <rect x="212" y="126" width="56" height="28" rx="3"/>
    <rect x="270" y="174" width="56" height="28" rx="3"/>
  </g>
  <g fill="#fff">
    <text x="162" y="96">image</text><text x="220" y="144">image</text><text x="278" y="192">image</text>
  </g>

  <!-- Generation, one token per running sequence per step. -->
  <g fill="#b279a2">
    <rect x="216" y="86" width="384" height="12" rx="3"/>
    <rect x="274" y="134" width="476" height="12" rx="3"/>
    <rect x="332" y="182" width="358" height="12" rx="3"/>
  </g>
  <text x="606" y="96" fill="#555">done; its sequence is freed</text>

  <!-- A request that waited for a free sequence. -->
  <rect x="600" y="222" width="60" height="28" rx="3" fill="#bab0ac" fill-opacity="0.45" stroke="#bab0ac" stroke-dasharray="3 2"/>
  <rect x="662" y="222" width="56" height="28" rx="3" fill="#f58518"/>
  <text x="670" y="240" fill="#fff">image</text>
  <rect x="720" y="230" width="120" height="12" rx="3" fill="#b279a2"/>
  <text x="440" y="240" fill="#555">waits for a free sequence, then joins</text>

  <!-- Legend. -->
  <g>
    <rect x="20" y="288" width="14" height="14" rx="2" fill="#bab0ac"/>
    <text x="40" y="300" fill="#333">shared instructions</text>
    <rect x="190" y="288" width="14" height="14" rx="2" fill="#f58518"/>
    <text x="210" y="300" fill="#333">an image, read alone</text>
    <rect x="370" y="288" width="14" height="14" rx="2" fill="#b279a2"/>
    <text x="390" y="300" fill="#333">generated text</text>
    <line x1="520" y1="286" x2="520" y2="304" stroke="#bbb"/>
    <text x="530" y="300" fill="#333">one decode step for every running sequence</text>
  </g>
</svg>
