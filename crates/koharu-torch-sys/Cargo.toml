[package]
name = "koharu-torch-sys"
version.workspace = true
edition.workspace = true
description = "The koharu-rs/torch shim's C API to libtorch, bound to the build Koharu's runtime loads."
license = "MIT OR Apache-2.0"
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["pytorch", "libtorch", "ffi", "deep-learning", "machine-learning"]
categories = ["external-ffi-bindings", "science"]
publish = true
build = "build.rs"

[dependencies]
libloading = { workspace = true }

[build-dependencies]
koharu-bindgen = { workspace = true }

# Only the generated bindings use it.
[package.metadata.cargo-machete]
ignored = ["libloading"]
