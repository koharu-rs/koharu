[package]
name = "llama-cpp-sys-2"
# The version `llama-cpp-2` asks for, so the workspace's `[patch.crates-io]`
# replaces upstream's crate with this one.
version = "0.1.160"
edition.workspace = true
description = "llama.cpp's C API, bound to the build Koharu's runtime loads."
license = "MIT OR Apache-2.0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# Upstream's features, which `llama-cpp-2` forwards; the build doesn't change
# with them, as the library comes from the runtime. `common` stays off: the
# helper library behind it isn't part of the runtime's build.
[features]
common = []
cuda = []
cuda-no-vmm = ["cuda"]
dynamic-backends = ["dynamic-link"]
dynamic-link = []
metal = []
mkl = []
mtmd = []
opencl = []
openmp = []
rocm = []
shared-stdcxx = []
static-openmp = ["openmp"]
static-stdcxx = []
system-ggml = []
system-ggml-static = ["system-ggml"]
vulkan = []
webgpu = []

[dependencies]
libloading = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
koharu-bindgen = { workspace = true }
