<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#666"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#222">From a machine to a ready device</text>

  <!-- Discover -->
  <rect x="20" y="64" width="190" height="150" rx="8" fill="#eef3f8" stroke="#4c78a8"/>
  <text x="34" y="88" font-weight="600" fill="#222">Find GPUs</text>
  <text x="34" y="110" fill="#555">1. Metal or NVIDIA</text>
  <text x="34" y="130" fill="#555">2. discrete AMD</text>
  <text x="34" y="150" fill="#555">3. integrated GPUs</text>
  <text x="34" y="170" fill="#555">4. Vulkan</text>
  <text x="34" y="196" fill="#777" font-size="12">best first</text>

  <!-- Install -->
  <rect x="250" y="64" width="210" height="150" rx="8" fill="#fdf1e6" stroke="#f58518"/>
  <text x="264" y="88" font-weight="600" fill="#222">Install its packages</text>
  <text x="264" y="110" fill="#555">download in ranges</text>
  <text x="264" y="130" fill="#555">check each file's SHA-256</text>
  <text x="264" y="150" fill="#555">extract into staging</text>
  <text x="264" y="170" fill="#555">rename into the store</text>
  <text x="264" y="196" fill="#777" font-size="12">skipped when already there</text>

  <!-- Load -->
  <rect x="500" y="64" width="190" height="150" rx="8" fill="#f3eef6" stroke="#b279a2"/>
  <text x="514" y="88" font-weight="600" fill="#222">Load the libraries</text>
  <text x="514" y="110" fill="#555">CUDA or ROCm</text>
  <text x="514" y="130" fill="#555">libtorch</text>
  <text x="514" y="150" fill="#555">llama.cpp</text>
  <text x="514" y="170" fill="#555">stable-diffusion.cpp</text>
  <text x="514" y="196" fill="#777" font-size="12">every function resolved</text>

  <!-- Ready -->
  <rect x="730" y="64" width="150" height="150" rx="8" fill="#f1f5ee" stroke="#54a24b"/>
  <text x="744" y="88" font-weight="600" fill="#222">Ready</text>
  <text x="744" y="110" fill="#555">the device</text>
  <text x="744" y="130" fill="#555">llama.cpp</text>
  <text x="744" y="150" fill="#555">confirmed</text>
  <text x="744" y="170" fill="#555">free memory,</text>
  <text x="744" y="190" fill="#555">read live</text>

  <g stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M210 139 L248 139"/>
    <path d="M460 139 L498 139"/>
    <path d="M690 139 L728 139"/>
  </g>

  <!-- Fall back -->
  <g stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arrow)">
    <path d="M355 214 C355 270 115 270 115 216"/>
    <path d="M595 214 C595 290 115 290 115 216"/>
  </g>
  <text x="300" y="300" fill="#777" font-size="12">a failure tries the next GPU</text>

  <!-- No GPU -->
  <rect x="20" y="320" width="300" height="56" rx="8" fill="#fbeaea" stroke="#e45756"/>
  <text x="34" y="343" font-weight="600" fill="#222">No GPU left</text>
  <text x="34" y="362" fill="#555">the app says what Koharu needs</text>
  <g stroke="#e45756" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M115 214 L115 318"/>
  </g>

  <!-- Models -->
  <rect x="560" y="320" width="320" height="56" rx="8" fill="#f6f6f6" stroke="#999"/>
  <text x="574" y="343" font-weight="600" fill="#222">Model files, on first use</text>
  <text x="574" y="362" fill="#555">pinned commit, checked against the Hub's hash</text>
  <g stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M805 214 L805 318"/>
  </g>
</svg>
